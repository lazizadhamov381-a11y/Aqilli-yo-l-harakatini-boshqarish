services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports: ["5432:5432"]

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://traffic_user:${DB_PASSWORD:-change_me}@db:5432/traffic
    depends_on: [db]
    ports: ["8080:8080"]

volumes:
  pgdata:
